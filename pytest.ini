[pytest]
# 只从 tests/ 收集用例。
# 项目根目录下可能存在同名的测试快照目录（如 backups/paper-manager-*/tests/），
# 那两个 test_core.py 重名会让 pytest 以 "import file mismatch" 直接中止收集。
testpaths = tests

# 双保险：即使有人显式传了路径，也不要递归进这些目录。
norecursedirs = *.egg .* _darcs build CVS dist venv {arch} backups node_modules frontend data library_files

# 无论用 `pytest` 还是 `python -m pytest` 启动，都保证 tests/ 能 import backend。
pythonpath = .
